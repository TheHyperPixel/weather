name: app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.18.2 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  platform: ^3.2.0
  get_it: ^9.3.0
  provider: ^6.1.5+1
  injectable: ^3.0.0
  intl: ^0.20.3
  equatable: ^3.0.0
  google_maps_flutter: ^2.19.0
  google_maps_flutter_web: ^0.6.5
  animations: ^3.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  injectable_generator: ^3.1.3
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - lib/assets/
    - lib/assets/audio/
    - lib/assets/video/
    - lib/assets/images/
    - lib/assets/images/2.0x/
    - lib/assets/images/3.0x/
    - lib/assets/maps/

  fonts:
    - family: Outfit
      fonts:
        - asset: lib/assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: lib/assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: lib/assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
