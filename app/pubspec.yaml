name: app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.18.2 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  firebase_analytics: 10.4.3
  # firebase_app_check: 0.1.2
  firebase_auth: 4.6.3
  firebase_core: 2.14.0
  firebase_crashlytics: 3.3.3
  firebase_messaging: 14.6.4
  firebase_storage: 11.2.4
  cloud_firestore: 4.8.2
  firebase_remote_config: 4.2.3
  firebase_dynamic_links: 5.3.3


  bloc: 8.1.2
  flutter_bloc: 8.1.3

  platform: ^3.1.0
  get_it: 7.6.0
  provider: 6.0.5
  injectable: 2.1.2
  intl: 0.18.0
  package_info_plus: 4.0.2
  equatable: 2.0.5
  url_launcher: 6.1.12
  shared_preferences: 2.2.0
  video_player: 2.7.0
  image_picker: 1.0.0
  image: 4.0.17
  # dio: 4.0.6
  uuid: 3.0.7
  # clipboard: 0.1.3
  # in_app_review: 2.0.6
  google_maps_flutter: 2.3.1
  google_maps_flutter_web: 0.5.1
  animations: 2.0.7
  pointer_interceptor: 0.9.3+4
  file_picker: 5.3.2
  video_compress: 3.1.2
  geocoding: 2.1.0
  flutter_secure_storage: 8.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 2.0.2
  build_runner: 2.4.6
  injectable_generator: 2.1.6
  bloc_test: 9.1.3

flutter:
  uses-material-design: true
  assets:
    - lib/assets/
    - lib/assets/audio/
    - lib/assets/video/
    - lib/assets/images/
    - lib/assets/images/2.0x/
    - lib/assets/images/3.0x/
    - lib/assets/maps/

  fonts:
    - family: Outfit
      fonts:
        - asset: lib/assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: lib/assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: lib/assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
