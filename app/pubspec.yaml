name: app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.18.2 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  bloc: 8.1.2
  flutter_bloc: 8.1.3
  platform: 3.1.0
  get_it: 7.6.0
  provider: 6.0.5
  injectable: 2.1.2
  intl: 0.18.0
  equatable: 2.0.5
  google_maps_flutter: 2.3.1
  google_maps_flutter_web: 0.5.1
  animations: 2.0.7
  http: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 2.0.2
  build_runner: 2.4.6
  injectable_generator: 2.1.6
  bloc_test: 9.1.3
  mocktail: ^0.3.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/
    - lib/assets/audio/
    - lib/assets/video/
    - lib/assets/images/
    - lib/assets/images/2.0x/
    - lib/assets/images/3.0x/
    - lib/assets/maps/

  fonts:
    - family: Outfit
      fonts:
        - asset: lib/assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: lib/assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: lib/assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
